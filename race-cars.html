<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Race Cars</title>
  <style>
    .car-button {
      background-color: green;
      color: white;
      padding: 10px 24px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .car-button:hover {
      background-color: blue;
    }
  </style>
</head>
<body>
  <h1>Race Cars</h1>

  <table border="1">
    <thead>
      <tr>
        <th>RACE CAR</th>
        <th>Engine Power in Horse Power</th>
        <th>Maximum Speed</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Porsche</td>
        <td>640 hp</td>
        <td>330 km/h</td>
      </tr>
      <tr>
        <td>BMW</td>
        <td>503 hp</td>
        <td>305 km/h</td>
      </tr>
      <tr>
        <td>Jaguar</td>
        <td>567 hp</td>
        <td>322 km/h</td>
      </tr>
      <tr>
        <td>Maserati</td>
        <td>620 hp</td>
        <td>325 km/h</td>
      </tr>
    </tbody>
  </table>

  <br>
  <img src="porsche.jpg" alt="Porsche race car" width="300">

  <br><br>
  <button class="car-button">Porsche</button>
</body>
</html>
